<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8f1150" />
    <meta
      name="description"
      content="Ìpè: book owambes, meetups, concerts and conferences across Nigeria, and run your own event's guest list, aso-ebi orders and tickets."
    />
    <title>Ìpè · Your invitation to the best events in Naija</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Each font was checked glyph by glyph for ₦ and the Yoruba letters ẹ ọ ṣ
      (plus the combining tone marks). Several popular fonts list a "latin-ext"
      subset and still have no ₦, so a subset name alone isn't proof.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400..600&family=Commissioner:wght@400..800&family=Noto+Serif+Display:ital,wght@0,500..800;1,500..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before React so the page never flashes the wrong theme.
      try {
        var saved = localStorage.getItem('ipe-theme')
        var dark = saved === 'dark' || saved === 'light' ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        // Storage blocked: follow the OS.
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
